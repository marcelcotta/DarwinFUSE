<h1>DarwinFUSE</h1>

<p>完全在用户空间运行的<span class="highlight">macOS FUSE实现</span>——无需内核扩展、
无需更改SIP、无第三方依赖。</p>

<h2>此安装器的功能</h2>
<ul>
    <li>安装DarwinFUSE动态库（<code>libfuse.2.dylib</code>）</li>
    <li>安装兼容macFUSE的头文件和pkg-config文件</li>
    <li>创建兼容性符号链接，使现有FUSE程序正常工作</li>
</ul>

<p>现有的FUSE程序（sshfs、encfs、ntfs-3g等）无需重新编译即可使用。</p>
