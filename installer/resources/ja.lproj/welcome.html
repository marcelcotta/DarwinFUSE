<h1>DarwinFUSE</h1>

<p>完全にユーザー空間で動作する<span class="highlight">macOS向けFUSE実装</span>です。
カーネル拡張不要、SIPの変更不要、サードパーティ依存なし。</p>

<h2>このインストーラの内容</h2>
<ul>
    <li>DarwinFUSE動的ライブラリ（<code>libfuse.2.dylib</code>）をインストール</li>
    <li>macFUSE互換のヘッダーとpkg-configファイルをインストール</li>
    <li>既存のFUSEプログラム向けに互換シンボリックリンクを作成</li>
</ul>

<p>既存のFUSEプログラム（sshfs、encfs、ntfs-3gなど）は
再コンパイルなしで動作します。</p>

</body>
